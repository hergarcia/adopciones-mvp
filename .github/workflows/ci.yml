name: ci

# Same sequence as `pnpm verify`, one step per gate so a red run names what failed.
# Everything runs against the local production build: nothing is deployed until the MVP.
#
# No step here is conditional. The scaffold story removed the bootstrap guard that skipped every
# gate while `package.json` was missing, and with it the fourteen `if:` conditions that depended on
# it: leaving those behind would have made every gate skip and this check report green without
# verifying anything.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the mutation step diffs the PR against its base

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # No `supabase/setup-cli`: the CLI is a devDependency, so the lockfile guarantees the machine
      # and CI run the identical version instead of an action pin having to match a system install
      # (FR-008). Renovate keeps it current, which is what MUST #1 asks for.
      # Exports the local URL and keys under the names the app uses, so the RLS tests run unchanged.
      - name: Supabase local
        run: |
          pnpm exec supabase start
          pnpm exec supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            | sed 's/"//g' >> "$GITHUB_ENV"

      - name: Unit and RLS tests
        run: pnpm test

      - name: Mutation testing
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm mutation --base "origin/${{ github.base_ref }}"
          else
            pnpm mutation:all
          fi

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: reports/mutation
          if-no-files-found: ignore

      - name: Build
        run: pnpm build

      # No `if [ -f playwright.config.ts ]` guard: the file exists, and a step that skips itself in
      # silence is exactly what FR-017 forbids. `pnpm e2e` passes with no specs and says so.
      - name: e2e (Playwright against next start)
        run: |
          pnpm exec playwright install chromium --with-deps
          pnpm e2e

      # `pnpm lighthouse`, not the Lighthouse action: CI has to run the same stage as the machine.
      - name: Lighthouse
        run: pnpm lighthouse

      - name: Upload lighthouse report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: .lighthouseci
          # `.lighthouseci` empieza con punto y upload-artifact ignora los ocultos: sin esto el
          # reporte nunca se sube, que es justo cuando hace falta (la etapa no corre en Windows).
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Stop Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup || true
