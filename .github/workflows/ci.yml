name: ci

# The stages of `pnpm verify`, in parallel jobs so a PR waits for the slowest one and not for their
# sum; `ci`, the check the branch rule requires, joins them. Everything runs against the local
# production build: nothing is deployed until the MVP.
#
# No gate here is conditional except mutation on main (the PR already mutated exactly what the
# squash brings, and the whole tree takes longer than a job may: mutation-nightly.yml runs it) and
# the heavy jobs on a PR that only changes text (`changes` below).
# The rules approval is not a gate of the code but of the PR, so it runs only on one.

on:
  push:
    branches: [main]
  # `labeled` and `unlabeled` re-run the approval step when Hernán adds or removes the label.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CI: true

jobs:
  # A PR that only changes text (docs, specs, the pipeline's instructions) skips the database,
  # mutation and e2e jobs: none of them reads it. The rule and its test live in
  # scripts/gates/docs-only.mjs; main always runs everything.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.scope.outputs.code || 'true' }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0

      - name: Does the PR touch code
        id: scope
        if: github.event_name == 'pull_request'
        run: node scripts/ci-scope.mjs --base "origin/${{ github.base_ref }}"

  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the rules approval diffs the PR against its base

      - uses: ./.github/actions/setup

      # Only a PR has something to approve; on main it already went through one.
      - name: Rules approval
        if: github.event_name == 'pull_request'
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: node scripts/check-protected.mjs --base "origin/${{ github.base_ref }}"

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  # Unit and gate tests need no database: no Supabase to start.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Unit and gate tests
        run: pnpm exec vitest run --project unit --project gates

  # The database tests run in series because they share one database, so they were 557 of the
  # job's 586 s and the slowest path of every PR. Each shard starts its own Supabase, so they
  # share nothing; four keep the longest under the e2e job (docs/09, 2026-10-26).
  test-db:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - uses: ./.github/actions/supabase

      - name: RLS and database tests (${{ matrix.shard }}/4)
        run: pnpm exec vitest run --project db --shard=${{ matrix.shard }}/4

  # The sibling tests of the mutated files are unit tests: no database to start.
  mutation:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the mutation step diffs the PR against its base

      - uses: ./.github/actions/setup

      - name: Mutation testing
        run: pnpm mutation --base "origin/${{ github.base_ref }}"

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: reports/mutation
          if-no-files-found: ignore

  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The e2e for the "¿sigue disponible?" reminder calls the cron route with this header, and
      # `next start` only accepts it when the server has the same value. Not a secret: local stack.
      CRON_SECRET: ci-local
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - uses: ./.github/actions/supabase

      - name: Build
        run: pnpm build

      # No `if [ -f playwright.config.ts ]` guard: the file exists, and a step that skips itself in
      # silence is exactly what FR-017 forbids. `pnpm e2e` passes with no specs and says so.
      - name: e2e (Playwright against next start)
        run: |
          pnpm exec playwright install chromium --with-deps
          pnpm e2e

      # `pnpm lighthouse`, not the Lighthouse action: CI has to run the same stage as the machine.
      - name: Lighthouse
        run: pnpm lighthouse

      - name: Upload lighthouse report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: .lighthouseci
          # `.lighthouseci` empieza con punto y upload-artifact ignora los ocultos: sin esto el
          # reporte nunca se sube, que es justo cuando hace falta (la etapa no corre en Windows).
          include-hidden-files: true
          if-no-files-found: ignore

  ci:
    if: always()
    needs: [changes, static, test, test-db, mutation, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A job that never ran is `skipped` only by design (mutation on main, the heavy jobs on a PR of
      # text); anything else that is not `success` — failed, cancelled — fails the check and names
      # the job. `changes` itself must pass: if it failed, the jobs it gates would read as skipped.
      - name: Every job green
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e '.changes.result == "success" and all(.[]; .result == "success" or .result == "skipped")' >/dev/null
